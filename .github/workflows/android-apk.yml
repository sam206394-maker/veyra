name: Build Android APK

on:
  push:
    branches: [master]
    paths: ['android-wrapper/**']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest GitHub runners ship a preinstalled Android SDK, so no
      # extra SDK setup step is needed here.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-wrapper/package-lock.json

      - name: Install wrapper dependencies
        run: npm ci
        working-directory: android-wrapper

      - name: Sync Capacitor config
        run: npx cap sync android
        working-directory: android-wrapper

      - name: Inject signing key (optional)
        working-directory: android-wrapper/android
        env:
          VEYRA_KEYSTORE_BASE64: ${{ secrets.VEYRA_KEYSTORE_BASE64 }}
          VEYRA_KEYSTORE_PASSWORD: ${{ secrets.VEYRA_KEYSTORE_PASSWORD }}
          VEYRA_KEY_ALIAS: ${{ secrets.VEYRA_KEY_ALIAS }}
          VEYRA_KEY_PASSWORD: ${{ secrets.VEYRA_KEY_PASSWORD }}
        run: |
          if [ -n "$VEYRA_KEYSTORE_BASE64" ]; then
            echo "$VEYRA_KEYSTORE_BASE64" | base64 -d > keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$VEYRA_KEYSTORE_PASSWORD" "$VEYRA_KEY_ALIAS" "$VEYRA_KEY_PASSWORD" > keystore.properties
            echo "Signing with release keystore"
          else
            echo "No keystore secrets found - APK will be debug-signed (still installable)"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android-wrapper/android

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-apk
          path: android-wrapper/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-wrapper/android/app/build/outputs/apk/release/app-release.apk
